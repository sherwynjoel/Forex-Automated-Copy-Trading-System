[project]
name = "copier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ctrader-open-api==0.9.2",
    "psycopg[binary]>=3.2",
    "cryptography>=42",
    # T1: real TLS verification for every cTrader connection. Twisted comes in
    # transitively via ctrader-open-api, but WITHOUT its `tls` extra it can only
    # do "rudimentary" hostname verification (common-name only, no SAN) and
    # warns about it at import time -- so optionsForClientTLS(host,
    # trustRoot=platformTrust()) would validate the chain but not properly
    # validate the identity. `service-identity` (the extra's substantive half;
    # pyOpenSSL is already a direct ctrader-open-api dependency) is what makes
    # the hostname check real, and this project now uses Twisted's TLS APIs
    # directly, so it is a direct dependency here rather than an implicit one.
    "service-identity>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-twisted>=1.14", "pytest-timeout>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
