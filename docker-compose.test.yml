services:
  # Fake cTrader Open API server for the compose-level end-to-end test: a
  # real TLS/protobuf server (FakeCTraderServer) on the real cTrader port
  # (5035) plus a tiny HTTP scenario-control API on 9000 that
  # e2e/test_full_stack.py drives to push master-side fills/closes/pending
  # placements. Reuses the copier image/build context since fake_main.py
  # lives inside copier/src/copier/testing/ and is installed as part of the
  # copier package.
  fake-ctrader:
    build: { context: ., dockerfile: copier/Dockerfile }
    command: python -m copier.testing.fake_main
    ports:
      - "127.0.0.1:9000:9000"

  # Isolates the test stack's data from a developer's normal dev stack
  # (task-30 review finding I4): the base docker-compose.yml also publishes
  # 127.0.0.1:5433, so a developer with their ordinary stack up who runs
  # `pytest e2e/test_full_stack.py` against the wrong terminal would
  # otherwise have e2e/test_full_stack.py's `TRUNCATE ... CASCADE` wipe
  # their real accounts/OAuth grants/audit log with no prompt and no way
  # back -- "is fake-ctrader up" is not a sufficient guard, since a
  # half-applied override (this file layered onto an already-running dev
  # stack) can make that true too. A distinct DATABASE NAME closes this
  # for real: e2e/test_full_stack.py's hardcoded DSN only ever names
  # `copytrader_e2e`, which does not exist in a plain `docker-compose.yml`
  # stack (POSTGRES_DB there is `copytrader`, and Postgres only creates the
  # env-var-named DB on a FRESH data volume) -- so pointing the test at the
  # wrong stack fails loudly on connect, before any TRUNCATE statement is
  # even sent, instead of silently succeeding against the wrong data.
  postgres:
    environment:
      POSTGRES_DB: copytrader_e2e

  migrate:
    environment:
      POSTGRES_DSN: postgresql://copytrader:${POSTGRES_PASSWORD:-copytrader}@postgres:5432/copytrader_e2e

  copier:
    environment:
      # Points the copier's demo-environment client at fake-ctrader instead
      # of the real demo.ctraderapi.com. CTRADER_PORT is left at .env's
      # default (5035), which fake-ctrader also listens on.
      CTRADER_DEMO_HOST: fake-ctrader
      POSTGRES_DSN: postgresql://copytrader:${POSTGRES_PASSWORD:-copytrader}@postgres:5432/copytrader_e2e
    depends_on:
      fake-ctrader:
        condition: service_started
    # Test-only: the base docker-compose.yml deliberately never publishes
    # this port (spec §8 -- control endpoint is Docker-internal only in
    # production). e2e/test_full_stack.py needs to reach it directly
    # (POST /reload) because PUT /api/settings only calls /reload as a
    # SIDE EFFECT of an actual settings change (settings_control.py) --
    # there is no api-proxied way to reload after seeding accounts
    # straight into Postgres without also mutating a setting.
    ports:
      - "127.0.0.1:8081:8080"

  api:
    environment:
      # The e2e test drives the API over plain http://127.0.0.1:8000 (no
      # TLS termination in this local/test topology); with the default
      # cookie_secure=true, the session/csrf cookies set by POST /api/login
      # would carry the Secure attribute and never be sent back over http.
      # Same override the api test suite's own conftest.py already uses for
      # the same reason (see api/tests/conftest.py).
      COOKIE_SECURE: "false"
      POSTGRES_DSN: postgresql://copytrader:${POSTGRES_PASSWORD:-copytrader}@postgres:5432/copytrader_e2e
