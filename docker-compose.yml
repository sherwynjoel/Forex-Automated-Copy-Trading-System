services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: copytrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copytrader}
      POSTGRES_DB: copytrader
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copytrader"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build: { context: ., dockerfile: db/Dockerfile }
    environment:
      POSTGRES_DSN: postgresql://copytrader:${POSTGRES_PASSWORD:-copytrader}@postgres:5432/copytrader
    depends_on:
      postgres: { condition: service_healthy }

  copier:
    build: { context: ., dockerfile: copier/Dockerfile }
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://copytrader:${POSTGRES_PASSWORD:-copytrader}@postgres:5432/copytrader
    depends_on:
      migrate: { condition: service_completed_successfully }
    # control port 8080 is intentionally NOT published — internal network only (spec §8)

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file: .env
    ports:
      # LOOPBACK ONLY, like postgres above (N7). A bare "8000:8000" binds
      # 0.0.0.0, so on the README's own Stage-4 "move to a VPS" path this
      # published the admin dashboard -- single-password login, session
      # cookies that need COOKIE_SECURE=false to work over plain HTTP -- on
      # the public internet in cleartext. On a VPS, front this with a TLS
      # reverse proxy or reach it over an SSH tunnel; see the README's
      # "Deploying to a VPS" section.
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_DSN: postgresql://copytrader:${POSTGRES_PASSWORD:-copytrader}@postgres:5432/copytrader
      COPIER_CONTROL_URL: http://copier:8080
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata: {}
