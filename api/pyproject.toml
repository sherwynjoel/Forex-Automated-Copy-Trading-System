[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
# T9a: `websockets` is imported directly by tests/test_events_ws.py. It was
# only ever present transitively (via uvicorn[standard]), so any change to
# uvicorn's extras would have broken the api suite with an ImportError that
# looked nothing like its cause. Declared explicitly here because this
# project depends on it directly.
dev = ["pytest>=8", "pytest-timeout>=2", "pytest-asyncio>=0.24", "websockets>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
